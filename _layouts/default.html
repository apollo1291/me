<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | xml_escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | xml_escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | xml_escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  {% endif %}
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}?v=1" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="{{ '/favicon.png' | relative_url }}?v=1" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}?v=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=3">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <style>
    .about-layout { display: flex; gap: 2.5rem; align-items: flex-start; }
    .about-headshot-wrap {
      width: 180px; height: 180px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0; background: #1a1a1a;
    }
    .about-headshot { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 600px) {
      .about-layout { flex-direction: column; align-items: center; gap: 1.5rem; }
      .about-headshot-wrap { width: 140px; height: 140px; }
    }
  </style>
</head>
<body{% if page.layout == 'post' %} class="post-page"{% endif %}>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-name">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="{% if page.layout != 'post' %}{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}{% endif %}">About</a>
      <a href="{{ '/blog' | relative_url }}" class="{% if page.layout == 'post' or page.url == '/blog/' or page.url == '/blog.html' %}active{% endif %}">Blog</a>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <a href="mailto:{{ site.email }}" aria-label="Email">@</a>
    <a href="https://github.com/apollo1291" aria-label="GitHub" target="_blank" rel="noopener">gh</a>
    <a href="https://www.linkedin.com/in/ellingtonhemphill" aria-label="LinkedIn" target="_blank" rel="noopener">in</a>
  </footer>
</body>
</html>
